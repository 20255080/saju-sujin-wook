</style>
</head>

    '신성욱은 어떤 여자에게 처음 끌리나요?',
    '신성욱이 관계에서 가장 조심해야 할 점은 무엇인가요?',
    '신성욱이 사랑할 때 반복하는 실수는 무엇인가요?',
  ],
  '신성욱-situation': [
    '신성욱이 연애에서 적극적인 편인지, 신중한 편인지, 불안할 때 어떤 태도를 보이는지 설명해주세요.',
    '신성욱의 명리학과 점성술 자료를 기준으로 애정 표현 방식, 불안할 때의 반응, 갈등이 생겼을 때 대화하는 방식, 상대가 오해하기 쉬운 부분을 알려주세요.',
    '신성욱의 명리학과 점성술 자료를 기준으로 남자 입장에서의 연애 성향을 분석해주세요. 어떤 여성을 오래 좋아하는지, 감정 표현은 어떤 방식인지, 관계에서 가장 조심해야 할 점은 무엇인지 알고 싶습니다. 김수진 같은 성향의 여성이 신성욱에게 어떤 매력과 부담으로 작용할 수 있는지도 설명해주세요.',
  ],
};

// ============================================================
// Placeholder (간단한 안내)
// ============================================================
const SIMPLE_PLACEHOLDER = `질문을 짧고 직접적으로 적어주세요.
아래 [예시 보기]를 누르면 자주 묻는 질문 목록이 펼쳐져요. 클릭하면 자동으로 채워집니다.`;

const SITUATION_PLACEHOLDER = `상황을 자세히 적어주세요. 가능하면 다음 순서로:
① 무슨 일이 있었나
② 두 사람의 행동·말
③ 본인이 느낀 감정
④ 묻고 싶은 것

아래 [예시 보기]를 누르면 자세한 예시들이 펼쳐져요.`;

function updatePlaceholder() {
  const ta = document.getElementById('question');
  ta.placeholder = currentInputType === 'situation' ? SITUATION_PLACEHOLDER : SIMPLE_PLACEHOLDER;
  ta.classList.toggle('situation-mode', currentInputType === 'situation');
  document.getElementById('question-section').classList.toggle('situation-mode', currentInputType === 'situation');
  document.getElementById('question-label').textContent =
    currentInputType === 'situation' ? 'Situation · 状況 描述' : 'Question · 問';
}

// ============================================================
// 예시 패널 렌더링
// ============================================================
function renderExamples() {
  const key = `${currentMode}-${currentInputType}`;
  const examples = EXAMPLES[key] || [];
  const panel = document.getElementById('examples-panel');
  panel.innerHTML = '';
  
  examples.forEach((ex, idx) => {
    const item = document.createElement('div');
    item.className = 'example-item';
    
    const preview = ex.length > 95 ? ex.slice(0, 95) + '…' : ex;
    item.innerHTML = `
      <div class="example-num">${String(idx + 1).padStart(2, '0')}</div>
      <div class="example-text">${escapeHtml(preview)}</div>
    `;
    item.addEventListener('click', () => {
      const ta = document.getElementById('question');
      ta.value = ex;
      ta.focus();
      // 패널 닫기
      document.getElementById('examples-panel').classList.remove('visible');
      updateToggleText();
    });
    panel.appendChild(item);
  });
  
  updateToggleText();
}

function updateToggleText() {
  const key = `${currentMode}-${currentInputType}`;
  const count = EXAMPLES[key]?.length || 0;
  const isOpen = document.getElementById('examples-panel').classList.contains('visible');
  document.getElementById('examples-toggle').textContent =
    isOpen ? `예시 숨기기 ▲` : `예시 보기 ▼ · ${count}개`;
}

document.getElementById('examples-toggle').addEventListener('click', () => {
  const panel = document.getElementById('examples-panel');
  panel.classList.toggle('visible');
  updateToggleText();
});

// ============================================================
// 프로필 로드
// ============================================================
async function loadProfiles() {
  try {
    const res = await fetch('/api/profiles');
    const profiles = await res.json();
    renderProfiles(profiles);
  } catch (e) {
    console.error('프로필 로드 실패', e);
  }
}

function renderProfiles(profiles) {
  const container = document.getElementById('profiles-row');
  container.innerHTML = '';
  const order = ['김수진', '신성욱'];
  order.forEach((name, idx) => {
    const p = profiles[name];
    if (!p) return;
    const card = document.createElement('div');
    card.className = 'profile-card ' + (idx === 0 ? 'self' : 'partner');
    card.dataset.name = name;
    
    const dataStatus = p.has_data 
      ? `<div class="data-status">✓ 자료 ${(p.data_chars / 1000).toFixed(1)}K자 (사주+점성술)</div>`
      : `<div class="data-status missing">⚠ data/ 폴더에 자료가 없습니다</div>`;
    
    card.innerHTML = `
      <div class="profile-name">
        <span class="name">${p.name}</span>
        <span class="meta">${p.gender} · ${p.date.replace(/-/g,'.')}</span>
      </div>
      <div class="profile-info">${p.occupation} · ${p.birthplace}</div>
      <div class="profile-saju">
        <div class="pillar-mini"><div class="chars">${p.saju.year_pillar}</div><div class="lbl">年柱</div></div>
        <div class="pillar-mini"><div class="chars">${p.saju.month_pillar}</div><div class="lbl">月柱</div></div>
        <div class="pillar-mini"><div class="chars">${p.saju.day_pillar}</div><div class="lbl">日柱</div></div>
        <div class="pillar-mini"><div class="chars">${p.saju.time_pillar}</div><div class="lbl">時柱</div></div>
      </div>
      ${dataStatus}
    `;
    container.appendChild(card);
  });
  updateProfileHighlight();
}

function updateProfileHighlight() {
  const cards = document.querySelectorAll('.profile-card');
  cards.forEach(c => {
    const name = c.dataset.name;
    if (currentMode === 'compatibility' || currentMode === name) {
      c.classList.add('active');
    } else {
      c.classList.remove('active');
    }
  });
}

loadProfiles();

// ============================================================
// 이벤트
// ============================================================
document.getElementById('mode-tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.mode-tab');
  if (!btn) return;
  document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentMode = btn.dataset.mode;
  updateProfileHighlight();
  updatePlaceholder();
  renderExamples();
});

document.getElementById('input-type-row').addEventListener('click', (e) => {
  const btn = e.target.closest('.input-type-btn');
  if (!btn) return;
  document.querySelectorAll('.input-type-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentInputType = btn.dataset.type;
  updatePlaceholder();
  renderExamples();
});

updatePlaceholder();
renderExamples();

// ============================================================
// 질문
// ============================================================
const askBtn = document.getElementById('ask-btn');
const answerSection = document.getElementById('answer-section');
const answerContent = document.getElementById('answer-content');
const answerMeta = document.getElementById('answer-meta');
const historyContainer = document.getElementById('history');

async function ask() {
  const question = document.getElementById('question').value.trim();
  if (!question) {
    alert('질문을 입력해 주세요.');
    return;
  }
  
  askBtn.disabled = true;
  askBtn.textContent = '해 석 중';
  answerSection.classList.add('visible');
  answerMeta.textContent = `${modeLabel(currentMode)} · ${typeLabel(currentInputType)} · 명리학 + 점성술`;
  answerContent.innerHTML = '<div class="loading">별과 사주의 흐름을 살피는 중<span class="loading-dots"></span></div>';
  
  setTimeout(() => answerSection.scrollIntoView({behavior: 'smooth', block: 'start'}), 150);
  
  try {
    const response = await fetch('/api/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        mode: currentMode,
        input_type: currentInputType,
        question: question,
        history: conversationHistory,
      }),
    });
    
    if (!response.ok) {
      const err = await response.json();
      throw new Error(err.error || `요청 실패 (${response.status})`);
    }
    
    const data = await response.json();
    
    answerMeta.textContent = `${modeLabel(currentMode)} · ${typeLabel(currentInputType)} · 명리학+점성술 · ${new Date().toLocaleString('ko-KR', {hour:'2-digit', minute:'2-digit'})}`;
    answerContent.innerHTML = renderStructuredAnswer(data.answer);
    
    conversationHistory.push({
      q: question, a: data.answer,
      mode: currentMode, type: currentInputType,
    });
    renderHistory();
    
  } catch (err) {
    answerMeta.textContent = 'Error';
    answerContent.innerHTML = `<div class="error">오류: ${err.message}</div>`;
  } finally {
    askBtn.disabled = false;
    askBtn.textContent = '묻 다';
  }
}

function renderStructuredAnswer(text) {
  const sectionLabels = {
    '결론': 'conclusion',
    '근거': 'evidence',
    '사주 근거': 'evidence',
    '현실 조언': 'advice',
    '조언': 'advice',
    '최적 표현': 'expression',
    '표현': 'expression',
  };
  
  const re = /\[([^\]]+)\]\s*([\s\S]*?)(?=\n\s*\[[^\]]+\]|$)/g;
  let html = '';
  let match;
  let parsedAny = false;
  
  while ((match = re.exec(text)) !== null) {
    const label = match[1].trim();
    const content = match[2].trim();
    if (!content) continue;
    
    let sectionClass = 'other';
    for (const [key, cls] of Object.entries(sectionLabels)) {
      if (label.includes(key)) {
        sectionClass = cls;
        break;
      }
    }
    
    parsedAny = true;
    html += `<div class="ans-block ${sectionClass}">
      <div class="ans-label">${escapeHtml(label)}</div>
      <div class="ans-text">${escapeHtml(content)}</div>
    </div>`;
  }
  
  if (!parsedAny) {
    html = `<div class="ans-text">${escapeHtml(text)}</div>`;
  }
  
  return html;
}

function modeLabel(m) {
  return {compatibility: '궁합', '김수진': '김수진', '신성욱': '신성욱'}[m] || m;
}
function typeLabel(t) {
  return {simple: '간단 질문', situation: '상황 설명'}[t] || t;
}

function renderHistory() {
  if (conversationHistory.length <= 1) { historyContainer.innerHTML = ''; return; }
  historyContainer.innerHTML = '<h3 class="history-title">Previous · 過去之問</h3>';
  conversationHistory.slice(0, -1).reverse().forEach(h => {
    const item = document.createElement('div');
    item.className = 'history-item';
    const truncated = h.a.length > 240 ? h.a.slice(0, 240) + '…' : h.a;
    item.innerHTML = `
      <div class="history-meta">${modeLabel(h.mode)} · ${typeLabel(h.type)}</div>
      <div class="history-q">問. ${escapeHtml(h.q)}</div>
      <div class="history-a">${escapeHtml(truncated)}</div>
    `;
    historyContainer.appendChild(item);
  });
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

askBtn.addEventListener('click', ask);
document.getElementById('question').addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') ask();
});
</script>
